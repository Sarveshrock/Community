name: community_app
description: A community platform for students, developers, and founders to find the right people and opportunities.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # UI / UX
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  file_picker: ^10.0.0
  emoji_picker_flutter: ^3.1.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  timeago: ^3.7.0
  google_fonts: ^6.2.1

  # System
  connectivity_plus: ^6.0.3
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.0
  geolocator: ^13.0.2
  video_player: ^2.9.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/app_icons/
